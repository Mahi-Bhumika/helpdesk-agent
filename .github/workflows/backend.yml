name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Build Docker image (sanity check the Dockerfile itself)
        run: docker build -t helpdesk-backend ./backend

      - name: Run smoke tests against a live uvicorn instance
        working-directory: backend
        env:
          # DATABASE_URL and SUPABASE_URL point at real Supabase deliberately:
          # TEST_TENANT_ID's real embedded documents only exist there.
          TEST_BASE_URL: http://localhost:8000
          TEST_TENANT_ID: ${{ secrets.TEST_TENANT_ID }}
          TEST_ORIGIN: ${{ secrets.TEST_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server is up after ${i}s"
              break
            fi
            echo "Waiting for server... (${i}s)"
            sleep 1
          done
          pytest tests/ -v