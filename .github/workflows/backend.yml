name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Docker image (sanity check the Dockerfile itself)
        run: docker build -t helpdesk-backend ./backend

      - name: Run smoke tests against a live uvicorn instance
        working-directory: backend
        env:
          # Loaded from repo secrets — Settings > Secrets and variables > Actions.
          # DATABASE_URL and SUPABASE_URL point at real Supabase deliberately —
          # smoke tests only SELECT, never write, and TEST_TENANT_ID's real
          # embedded documents only exist there, not in a disposable CI database.
          TEST_BASE_URL: http://localhost:8000
          TEST_TENANT_ID: ${{ secrets.TEST_TENANT_ID }}
          TEST_ORIGIN: ${{ secrets.TEST_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server is up after ${i}s"
              break
            fi
            echo "Waiting for server... (${i}s)"
            sleep 1
          done
          pytest tests/ -v