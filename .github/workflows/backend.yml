name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - main
      - add-frontend-ci
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpdesk_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check . --ignore B008

      - name: Build Docker image (sanity check)
        run: docker build -t helpdesk-backend .

      - name: Run smoke tests against a live uvicorn instance
        env:
          TEST_BASE_URL: http://localhost:8000
          TEST_TENANT_ID: ${{ secrets.TEST_TENANT_ID }}
          TEST_ORIGIN: ${{ secrets.TEST_ORIGIN }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/helpdesk_agent_test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWKS_URL: ${{ secrets.JWKS_URL }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          pytest tests/ -v